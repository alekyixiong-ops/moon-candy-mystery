<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrie, Marie &amp; Parrie — Earth, Water, Sky</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:linear-gradient(170deg,#1e1b4b 0%,#4c1d95 45%,#7c3aed 100%);
    font-family:Georgia,serif; color:#f5f3ff;
    display:flex; flex-direction:column; align-items:center;
    padding:26px 14px 50px; min-height:100vh;
  }
  h1{font-size:1.7rem;color:#fde68a;text-align:center;text-shadow:0 0 18px rgba(253,230,138,.5);}
  .sub{color:#ddd6fe;font-style:italic;margin:6px 0 22px;text-align:center;}
  .art{width:100%;max-width:760px;border-radius:20px;overflow:hidden;box-shadow:0 22px 55px rgba(0,0,0,.55);background:#fff;}
  .art svg{width:100%;height:auto;display:block;}
  .foot{margin-top:24px;color:#c4b5fd;font-size:.95rem;text-align:center;line-height:1.7;}
</style>
</head>
<body>
  <h1>&#127968; Carrie &#183; Marie &#183; Parrie</h1>
  <div class="sub">The three guardians of Furry Friends Island &#183; Earth &#183; Water &#183; Sky</div>
  <div class="art">
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500">
  <defs>
    <!-- SKY -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe4ff"/>
      <stop offset="60%" stop-color="#e6f3ff"/>
      <stop offset="100%" stop-color="#fff4e0"/>
    </linearGradient>
    <!-- MEADOW -->
    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8f5d0"/>
      <stop offset="55%" stop-color="#a8e6a1"/>
      <stop offset="100%" stop-color="#7fd47a"/>
    </linearGradient>
    <!-- SEA -->
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8e4ef"/>
      <stop offset="55%" stop-color="#5fc0d8"/>
      <stop offset="100%" stop-color="#2b7fb8"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9"/><stop offset="70%" stop-color="#ffe27a"/><stop offset="100%" stop-color="#ffd24d" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="bubble" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#dff6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9fdcf0" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="1500" fill="#ffffff"/>

  <!-- ================= SKY BAND ================= -->
  <rect x="0" y="0" width="1000" height="520" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="820" cy="120" r="95" fill="url(#sun)"/>
  <circle cx="820" cy="120" r="52" fill="#ffd94d"/>
  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="180" cy="110" rx="95" ry="36"/><ellipse cx="245" cy="92" rx="60" ry="30"/>
    <ellipse cx="640" cy="70" rx="70" ry="26"/>
    <ellipse cx="120" cy="300" rx="85" ry="32"/><ellipse cx="900" cy="300" rx="80" ry="30"/>
  </g>
  <!-- cloud castle -->
  <g transform="translate(200,215)">
    <rect x="-70" y="-40" width="140" height="70" rx="8" fill="#efe8ff" stroke="#c9b6f5" stroke-width="3"/>
    <rect x="-88" y="-95" width="34" height="125" rx="6" fill="#f4f0ff" stroke="#c9b6f5" stroke-width="3"/>
    <rect x="54" y="-95" width="34" height="125" rx="6" fill="#f4f0ff" stroke="#c9b6f5" stroke-width="3"/>
    <polygon points="-88,-95 -71,-140 -54,-95" fill="#d9b8ff"/>
    <polygon points="54,-95 71,-140 88,-95" fill="#d9b8ff"/>
    <polygon points="-70,-40 0,-85 70,-40" fill="#c9a2ff"/>
    <rect x="-16" y="-8" width="32" height="38" rx="16" fill="#b892ff"/>
    <circle cx="0" cy="-118" r="7" fill="#ffd166"/>
  </g>
  <!-- mushroom cottage -->
  <g transform="translate(795,300)">
    <ellipse cx="0" cy="-34" rx="52" ry="26" fill="#ff8f8f"/>
    <circle cx="-20" cy="-40" r="7" fill="#fff"/><circle cx="14" cy="-46" r="6" fill="#fff"/><circle cx="28" cy="-34" r="5" fill="#fff"/>
    <rect x="-24" y="-34" width="48" height="46" rx="6" fill="#fff3e0" stroke="#e0c9a6" stroke-width="2"/>
    <rect x="-9" y="-14" width="18" height="26" rx="8" fill="#c1873f"/>
  </g>

  <!-- PARRIE on her cloud -->
  <g transform="translate(500,395)">
    <ellipse cx="0" cy="86" rx="165" ry="52" fill="#ffffff"/>
    <ellipse cx="-70" cy="70" rx="90" ry="42" fill="#ffffff"/>
    <ellipse cx="80" cy="74" rx="80" ry="38" fill="#ffffff"/>
    <!-- wings -->
    <path d="M -52 -6 Q -132 -60 -104 -108 Q -66 -76 -44 -34 Z" fill="#fdfdff" stroke="#d8dcf0" stroke-width="3"/>
    <path d="M 52 -6 Q 132 -60 104 -108 Q 66 -76 44 -34 Z" fill="#fdfdff" stroke="#d8dcf0" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="0" cy="46" rx="52" ry="44" fill="#fffdf7" stroke="#e6dcc8" stroke-width="3"/>
    <!-- head -->
    <ellipse cx="0" cy="-16" rx="46" ry="40" fill="#fffdf7" stroke="#e6dcc8" stroke-width="3"/>
    <!-- floppy ears -->
    <ellipse cx="-40" cy="-4" rx="16" ry="26" fill="#fdf6e6" stroke="#e6dcc8" stroke-width="2"/>
    <ellipse cx="40" cy="-4" rx="16" ry="26" fill="#fdf6e6" stroke="#e6dcc8" stroke-width="2"/>
    <!-- tuft + bow -->
    <path d="M -6 -56 Q 2 -76 -2 -88" stroke="#fdf6e6" stroke-width="10" fill="none" stroke-linecap="round"/>
    <g transform="translate(-4,-74)">
      <polygon points="0,0 -16,-10 -16,10" fill="#8fd0f0"/>
      <polygon points="0,0 16,-10 16,10" fill="#8fd0f0"/>
      <circle r="5" fill="#6fbde4"/>
    </g>
    <!-- eyes -->
    <circle cx="-15" cy="-20" r="8" fill="#3a3a3a"/><circle cx="15" cy="-20" r="8" fill="#3a3a3a"/>
    <circle cx="-12" cy="-23" r="3" fill="#fff"/><circle cx="18" cy="-23" r="3" fill="#fff"/>
    <!-- happy open mouth -->
    <path d="M -12 0 Q 0 18 12 0 Z" fill="#ff8f8f"/>
    <!-- nose -->
    <ellipse cx="0" cy="-6" rx="6" ry="4.5" fill="#5a5a5a"/>
    <!-- pendant: cloud crystal -->
    <path d="M -26 30 Q 0 46 26 30" stroke="#c9c9c9" stroke-width="2" fill="none"/>
    <g transform="translate(0,56)">
      <ellipse cx="-12" cy="0" rx="14" ry="10" fill="#bfe4ff" opacity="0.95"/>
      <ellipse cx="12" cy="2" rx="11" ry="8" fill="#bfe4ff" opacity="0.95"/>
      <ellipse cx="0" cy="-6" rx="12" ry="9" fill="#dff2ff" opacity="0.95"/>
    </g>
  </g>

  <!-- realm label sky -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="240" height="46" rx="23" fill="#ffffff" opacity="0.85"/>
    <text x="120" y="31" font-family="Georgia, serif" font-size="22" fill="#2b6ea8" text-anchor="middle">☁️ PARRIE — Sky</text>
  </g>

  <!-- ================= MEADOW BAND ================= -->
  <rect x="0" y="520" width="1000" height="470" fill="url(#meadow)"/>
  <!-- blossom trees -->
  <g>
    <rect x="118" y="700" width="16" height="120" fill="#a9713f"/>
    <circle cx="126" cy="672" r="62" fill="#ffd0e4"/><circle cx="86" cy="700" r="42" fill="#ffbcd8"/><circle cx="168" cy="698" r="44" fill="#ffbcd8"/>
    <rect x="866" y="690" width="16" height="130" fill="#a9713f"/>
    <circle cx="874" cy="662" r="62" fill="#ffd0e4"/><circle cx="834" cy="692" r="42" fill="#ffbcd8"/><circle cx="916" cy="690" r="44" fill="#ffbcd8"/>
  </g>
  <!-- path -->
  <path d="M 380 990 Q 470 800 500 520 L 620 520 Q 570 800 520 990 Z" fill="#e8cfa0"/>
  <!-- flowers -->
  <g>
    <circle cx="220" cy="880" r="11" fill="#ff9ecb"/><circle cx="220" cy="880" r="4" fill="#ffd166"/>
    <circle cx="300" cy="930" r="10" fill="#ffb26b"/><circle cx="300" cy="930" r="4" fill="#fff3c4"/>
    <circle cx="700" cy="870" r="11" fill="#ff9ecb"/><circle cx="700" cy="870" r="4" fill="#ffd166"/>
    <circle cx="790" cy="930" r="10" fill="#c9a2ff"/><circle cx="790" cy="930" r="4" fill="#fff3c4"/>
    <circle cx="160" cy="940" r="9" fill="#ffd166"/><circle cx="860" cy="960" r="9" fill="#ffd166"/>
    <circle cx="250" cy="790" r="9" fill="#ff8fb3"/><circle cx="760" cy="800" r="9" fill="#ff8fb3"/>
  </g>
  <!-- Caria flowers (heart petals) -->
  <g>
    <g transform="translate(430,760)">
      <path d="M0,0 C -16,-18 -30,-26 -34,-12 C -36,-2 -16,4 0,18 C 16,4 36,-2 34,-12 C 30,-26 16,-18 0,0 Z" fill="#ff5f9e"/>
      <circle r="5" fill="#ffe08a"/>
    </g>
    <g transform="translate(600,820) scale(0.85)">
      <path d="M0,0 C -16,-18 -30,-26 -34,-12 C -36,-2 -16,4 0,18 C 16,4 36,-2 34,-12 C 30,-26 16,-18 0,0 Z" fill="#ff5f9e"/>
      <circle r="5" fill="#ffe08a"/>
    </g>
  </g>

  <!-- CARRIE -->
  <g transform="translate(500,700)">
    <!-- wings -->
    <path d="M -46 -20 Q -126 -78 -96 -124 Q -56 -92 -36 -48 Z" fill="#ffffff" stroke="#e2e2f2" stroke-width="3"/>
    <path d="M 46 -20 Q 126 -78 96 -124 Q 56 -92 36 -48 Z" fill="#ffffff" stroke="#e2e2f2" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="0" cy="52" rx="50" ry="46" fill="#ffffff" stroke="#e6e6f2" stroke-width="3"/>
    <!-- head -->
    <ellipse cx="0" cy="-14" rx="48" ry="42" fill="#ffffff" stroke="#e6e6f2" stroke-width="3"/>
    <!-- lop ears -->
    <ellipse cx="-44" cy="14" rx="18" ry="34" fill="#ffffff" stroke="#e6e6f2" stroke-width="3"/>
    <ellipse cx="-44" cy="14" rx="9" ry="22" fill="#ffd7e4"/>
    <ellipse cx="44" cy="14" rx="18" ry="34" fill="#ffffff" stroke="#e6e6f2" stroke-width="3"/>
    <ellipse cx="44" cy="14" rx="9" ry="22" fill="#ffd7e4"/>
    <!-- eyes -->
    <ellipse cx="-16" cy="-18" rx="7" ry="9" fill="#7f9db8"/><ellipse cx="16" cy="-18" rx="7" ry="9" fill="#7f9db8"/>
    <circle cx="-14" cy="-21" r="2.5" fill="#fff"/><circle cx="18" cy="-21" r="2.5" fill="#fff"/>
    <!-- nose + gentle smile -->
    <ellipse cx="0" cy="-2" rx="5" ry="4" fill="#ffb3c6"/>
    <path d="M -8 6 Q 0 12 8 6" stroke="#c99bab" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- paws tucked -->
    <ellipse cx="-12" cy="42" rx="13" ry="10" fill="#fdfdff" stroke="#e6e6f2" stroke-width="2"/>
    <ellipse cx="12" cy="42" rx="13" ry="10" fill="#fdfdff" stroke="#e6e6f2" stroke-width="2"/>
    <!-- clover pendant -->
    <path d="M -22 26 Q 0 42 22 26" stroke="#c9c9c9" stroke-width="2" fill="none"/>
    <g transform="translate(0,52)">
      <circle cx="-8" cy="-6" r="8" fill="#4fb86b"/><circle cx="8" cy="-6" r="8" fill="#4fb86b"/>
      <circle cx="-8" cy="8" r="8" fill="#3ea35a"/><circle cx="8" cy="8" r="8" fill="#3ea35a"/>
      <path d="M 0 18 Q 6 10 0 2" stroke="#2f8447" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- realm label meadow -->
  <g transform="translate(700,540)">
    <rect x="0" y="0" width="252" height="46" rx="23" fill="#ffffff" opacity="0.85"/>
    <text x="126" y="31" font-family="Georgia, serif" font-size="22" fill="#2f8447" text-anchor="middle">🌸 CARRIE — Land</text>
  </g>

  <!-- ================= SEA BAND ================= -->
  <rect x="0" y="990" width="1000" height="510" fill="url(#sea)"/>
  <!-- light rays -->
  <g fill="#ffffff" opacity="0.15">
    <polygon points="200,990 300,990 420,1500 260,1500"/>
    <polygon points="620,990 740,990 900,1500 720,1500"/>
  </g>
  <!-- corals -->
  <g>
    <g transform="translate(120,1420)">
      <path d="M0,0 L0,-110 M0,-60 L-34,-96 M0,-80 L30,-118" stroke="#ff8fb3" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(890,1440)">
      <path d="M0,0 L0,-100 M0,-50 L34,-86 M0,-70 L-28,-104" stroke="#ffa07a" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>
    <g transform="translate(60,1480)" fill="#c9a2ff">
      <circle cx="0" cy="0" r="16"/><circle cx="30" cy="-10" r="12"/><circle cx="-26" cy="-8" r="11"/>
    </g>
    <g transform="translate(950,1480)" fill="#8fd0f0">
      <circle cx="0" cy="0" r="15"/><circle cx="-28" cy="-10" r="11"/>
    </g>
  </g>
  <!-- seaweed -->
  <g stroke="#3ea35a" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 300 1500 Q 320 1420 300 1350 Q 282 1300 300 1250"/>
    <path d="M 340 1500 Q 362 1440 342 1380"/>
  </g>
  <!-- fairy lights -->
  <g fill="#ffe9a8">
    <circle cx="160" cy="1290" r="5"/><circle cx="240" cy="1340" r="4"/><circle cx="820" cy="1300" r="5"/>
    <circle cx="760" cy="1360" r="4"/><circle cx="640" cy="1290" r="4"/><circle cx="420" cy="1330" r="4"/>
  </g>

  <!-- MARIE in her bubble -->
  <g transform="translate(500,1250)">
    <circle r="185" fill="url(#bubble)" stroke="#bfeaff" stroke-width="4"/>
    <ellipse cx="-70" cy="-96" rx="42" ry="26" fill="#ffffff" opacity="0.75" transform="rotate(-28 -70 -96)"/>
    <!-- wings -->
    <path d="M -40 -6 Q -114 -56 -90 -100 Q -52 -72 -32 -34 Z" fill="#fdfdff" stroke="#dbeaf5" stroke-width="3" opacity="0.95"/>
    <path d="M 40 -6 Q 114 -56 90 -100 Q 52 -72 32 -34 Z" fill="#fdfdff" stroke="#dbeaf5" stroke-width="3" opacity="0.95"/>
    <!-- fluffy tail lifted -->
    <path d="M 52 62 Q 116 76 118 22 Q 96 40 62 34 Z" fill="#fffdfa" stroke="#e2e6f2" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="0" cy="54" rx="54" ry="48" fill="#fffdfa" stroke="#e2e6f2" stroke-width="3"/>
    <!-- fluff -->
    <circle cx="-40" cy="40" r="20" fill="#fffdfa"/><circle cx="40" cy="40" r="20" fill="#fffdfa"/>
    <!-- head -->
    <ellipse cx="0" cy="-22" rx="50" ry="44" fill="#fffdfa" stroke="#e2e6f2" stroke-width="3"/>
    <!-- ears -->
    <polygon points="-46,-52 -34,-104 -12,-52" fill="#fffdfa" stroke="#e2e6f2" stroke-width="3"/>
    <polygon points="-42,-60 -34,-92 -22,-60" fill="#ffd7e4"/>
    <polygon points="46,-52 34,-104 12,-52" fill="#fffdfa" stroke="#e2e6f2" stroke-width="3"/>
    <polygon points="42,-60 34,-92 22,-60" fill="#ffd7e4"/>
    <!-- bow -->
    <g transform="translate(-4,-72)">
      <polygon points="0,0 -18,-11 -18,11" fill="#8fd0f0"/>
      <polygon points="0,0 18,-11 18,11" fill="#8fd0f0"/>
      <circle r="5.5" fill="#6fbde4"/>
    </g>
    <!-- lime green eyes -->
    <ellipse cx="-17" cy="-26" rx="8" ry="11" fill="#7ddc4a"/><ellipse cx="17" cy="-26" rx="8" ry="11" fill="#7ddc4a"/>
    <ellipse cx="-17" cy="-26" rx="3" ry="9" fill="#2b3a1a"/><ellipse cx="17" cy="-26" rx="3" ry="9" fill="#2b3a1a"/>
    <circle cx="-14" cy="-30" r="2.5" fill="#fff"/><circle cx="20" cy="-30" r="2.5" fill="#fff"/>
    <!-- nose + whiskers -->
    <ellipse cx="0" cy="-8" rx="5" ry="3.5" fill="#ffb3c6"/>
    <g stroke="#d8cbe0" stroke-width="2">
      <path d="M -10 -4 L -44 -10"/><path d="M -10 2 L -44 6"/>
      <path d="M 10 -4 L 44 -10"/><path d="M 10 2 L 44 6"/>
    </g>
    <!-- bubble-glass pendant -->
    <g transform="translate(0,60)">
      <circle r="15" fill="#eaf9ff" opacity="0.9" stroke="#a8dff2" stroke-width="2"/>
      <circle cx="-5" cy="-5" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- realm label sea -->
  <g transform="translate(60,1015)">
    <rect x="0" y="0" width="240" height="46" rx="23" fill="#ffffff" opacity="0.85"/>
    <text x="120" y="31" font-family="Georgia, serif" font-size="22" fill="#2b7fb8" text-anchor="middle">🫧 MARIE — Sea</text>
  </g>

  <!-- bubbles -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="180" cy="1150" r="10"/><circle cx="230" cy="1080" r="6"/><circle cx="840" cy="1120" r="9"/>
    <circle cx="900" cy="1210" r="6"/><circle cx="120" cy="1240" r="7"/><circle cx="700" cy="1080" r="5"/>
  </g>

  <!-- title bar -->
  <g transform="translate(500,1470)">
    <rect x="-330" y="-30" width="660" height="56" rx="28" fill="#ffffff" opacity="0.9"/>
    <text x="0" y="9" font-family="Georgia, serif" font-size="26" fill="#7a1a5e" text-anchor="middle">Carrie · Marie · Parrie — Earth, Water, Sky 🌍💧☁️</text>
  </g>
</svg>
  </div>
  <div class="foot">
    Drawn for Charlotte by Alice the fairy &#129498;&#65039;&#10024;<br>
    &#128054; Parrie &#8212; Sky &#160;&#183;&#160; &#128048; Carrie &#8212; Land &#160;&#183;&#160; &#128049; Marie &#8212; Sea
  </div>
</body>
</html>
